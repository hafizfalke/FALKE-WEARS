<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>about</title>
    <style>
        body{
             background: rgb(2, 11, 22);
        }
        .falke-text{
            color: rgb(240, 201, 133);
            display: inline-block;
            padding-left: 80px;
            font-family: Arial;
            font-weight: bold;
            padding-right: 150px;
            cursor:pointer;
        }
        .home{
            background: rgb(6,20, 38);
            height: 50px;
            margin-top: -8px;
            position: sticky;
            top: 0px;
        }
        .search-box{
            display: inline-block;
            width: 140px;
            margin-left: 100px;
            border-radius: 4px;
            border: none;
            padding-top: 5px;
            padding-bottom: 5px;
            font-family: Arial;
            background-color: bisque;
        }
        .profile-icon{
            display: inline-block;
            color: white;
            margin-left: 70px;
            font-family: Arial;
            font-size: 14px;
            font-weight: bold;
            transition: color 0.15s;
            transition: opacity 0.15s;
        }
        .profile-icon:hover{
            color: rgb(240, 201, 133);
        }
        .profile-icon:active{
            opacity: 0.75;
        }
        .cart-icon{
            color: white;
            display: inline-block;
            margin-left: 150px;
        }
        .home-text{
            color: white;
            display: inline-block;
            font-family: Arial;
            font-size: 14px;
            padding-right: 50px;
            cursor: pointer;
            transition: opacity 0.15s;
            transition: underline 0.15s;
            transition: color 0.15s;
        }
        .home-text:hover{
            text-decoration: underline;
            color: rgb(240, 201, 133);
            text-decoration-thickness:2px ;
            text-underline-offset: 6px;
        }
        .home-text:active{
            opacity: 0.75;
        }
    </style>
</head>
<body>
<div CLASS="home">
    <p class="falke-text">
        FALKE WEARS
    </p>
    <a href="bigmove.html" class="home-text">
        Home
    </a>
    <a href="shop.html" class="home-text">
        Shop
    </a>
    <a href="about.html" class="home-text">
        About
    </a>
    <a href="contact.html" class="home-text">
        Contact
    </a>
    <input type="text" placeholder="Search Product.." class="search-box">
    <p class="cart-icon">
        &#128722;
    </p>
    <p class="profile-icon">
       Profile &#128100;
    </p>
</div>
<p>
    hafiz
</p>
</body>
</html>
